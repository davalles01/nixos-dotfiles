# Load GTK settings
exec-once = ~/nixos-dotfiles/config/hypr/scripts/gtk.sh

# Using hypridle to start hyprlock
exec-once = hypridle

# Load cliphist history
exec-once = wl-paste --watch cliphist store

# Start autostart cleanup
exec-once = ~/nixos-dotfiles/config/hypr/scripts/cleanup.sh
